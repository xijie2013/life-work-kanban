<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>任务农场 · Kanban Farm</title>
<link rel="manifest" href="farm-manifest.json">
<meta name="theme-color" content="#e58a3c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
  :root{
    --bg:#fff7ec; --panel:#fffdf8; --ink:#4a3b2a; --muted:#a8917a;
    --line:#ecdcc4; --accent:#e58a3c; --green:#6fa84f; --green-d:#557f3b;
    --blue:#4f86c6; --purple:#9a6fc6; --gold:#e8b23a; --red:#d2603a;
    --shadow:0 4px 14px rgba(120,80,30,.10);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{background:#e9d8bf;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:linear-gradient(160deg,#fff7ec,#ffeed8);color:var(--ink);
    width:360px;max-width:100%;margin:0 auto;height:100vh;height:100dvh;
    display:flex;flex-direction:column;overflow:hidden;
    box-shadow:0 0 36px rgba(110,75,30,.18);}
  #app{flex:1 1 auto;overflow-y:auto;min-height:0;-webkit-overflow-scrolling:touch;padding-bottom:calc(60px + env(safe-area-inset-bottom,0px));}
  .farm-pin{position:sticky;top:0;z-index:5;}
  .pin-flush{margin:0;border-radius:0 0 16px 16px;border-top:none;border-left:none;border-right:none;box-shadow:0 5px 10px rgba(120,80,30,.13);}
  h1,h2,h3,h4{margin:0;}
  .hidden{display:none!important;}

  /* top resource bar */
  .topbar{flex:0 0 auto;position:relative;z-index:30;background:rgba(255,253,248,.92);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);padding:8px 12px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;}
  .res{display:flex;align-items:center;gap:4px;font-weight:700;font-size:14px;}
  .res .ico{font-size:17px;}
  .res small{font-weight:600;color:var(--muted);font-size:11px;}
  .lvl-wrap{flex:1;min-width:120px;}
  .lvl-bar{height:7px;background:#efe2cd;border-radius:6px;overflow:hidden;margin-top:3px;}
  .lvl-fill{height:100%;background:linear-gradient(90deg,#f0c14b,#e58a3c);width:0%;transition:width .3s;}

  /* —— 图片化 HUD —— */
  .hud{display:flex;flex-direction:column;gap:6px;width:100%;}
  .hud-row{display:flex;align-items:center;gap:6px;}
  .hud-row2{justify-content:flex-end;}
  .stat-pill{display:flex;align-items:center;gap:4px;background:linear-gradient(#fffdf8,#fbf2e2);border:1px solid #ecdcc4;border-radius:20px;padding:3px 9px 3px 3px;box-shadow:0 1px 3px rgba(150,110,50,.12);}
  .stat-pill .pic{width:23px;height:23px;flex:0 0 auto;display:block;}
  .stat-pill .val{font-weight:800;font-size:13.5px;color:#5b4632;font-variant-numeric:tabular-nums;}
  #v-coin{display:inline-block;min-width:36px;text-align:left;}
  #v-energy{display:inline-block;min-width:17px;text-align:left;}
  .stat-pill.energy{cursor:pointer;border-color:#f1c860;background:linear-gradient(#fff8e6,#ffedba);animation:epulse 2.2s ease-in-out infinite;}
  @keyframes epulse{0%,100%{box-shadow:0 0 5px rgba(240,180,40,.3)}50%{box-shadow:0 0 13px rgba(240,180,40,.75)}}
  .hud .lvl-box{flex:1;display:flex;align-items:center;gap:6px;min-width:86px;}
  .hud .avatar{position:relative;width:29px;height:29px;flex:0 0 auto;}
  .hud .avatar svg{width:29px;height:29px;display:block;filter:drop-shadow(0 1px 1px rgba(0,0,0,.15))}
  .hud .lvl-badge{position:absolute;right:-5px;bottom:-4px;background:#e58a3c;color:#fff;font-size:8.5px;font-weight:800;border-radius:9px;padding:0 4px;border:1.5px solid #fffdf8;}
  .hud .xp{position:relative;flex:1;height:12px;background:#ecdcc4;border-radius:7px;overflow:hidden;min-width:56px;}
  .hud .xp-fill{position:relative;overflow:hidden;height:100%;width:0;background:linear-gradient(90deg,#7fc24a,#f0c14b,#e58a3c);border-radius:7px;transition:width .4s ease;}
  .hud .xp-fill::after{content:"";position:absolute;top:0;left:0;height:100%;width:45%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);animation:xpsheen 2.2s linear infinite;}
  @keyframes xpsheen{0%{transform:translateX(-130%)}100%{transform:translateX(320%)}}
  .hud .xp-txt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:8.5px;font-weight:800;color:#5b4632;text-shadow:0 1px 0 rgba(255,255,255,.5);}
  .hud .gear{border:none;background:#f3e8d6;border-radius:10px;width:30px;height:30px;font-size:15px;cursor:pointer;color:#7a6448;flex:0 0 auto;}
  .hud-badge{position:absolute;top:-5px;right:-5px;background:#d2603a;color:#fff;font-size:9px;font-weight:800;min-width:15px;height:15px;line-height:15px;border-radius:8px;padding:0 3px;display:none;box-shadow:0 1px 3px rgba(0,0,0,.25);}

  /* tabs */
  .tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:360px;max-width:100%;padding-bottom:env(safe-area-inset-bottom,0px);display:flex;
    background:var(--panel);border-top:1px solid var(--line);z-index:40;box-shadow:0 -2px 10px rgba(120,80,30,.06);}
  .tab{flex:1;border:none;background:none;padding:8px 2px 7px;font-size:11px;color:var(--muted);
    display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;font-weight:600;}
  .tab .tico{font-size:21px;line-height:1;}
  .tab.active{color:var(--accent);}
  .tab.active .tico{transform:translateY(-1px);filter:drop-shadow(0 2px 3px rgba(229,138,60,.4));}

  .screen{padding:12px;}
  .screen-title{font-size:16px;font-weight:800;margin-bottom:2px;display:flex;align-items:center;gap:6px;}
  .screen-sub{font-size:12px;color:var(--muted);margin-bottom:12px;}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:13px;margin-bottom:12px;}
  .row{display:flex;align-items:center;gap:10px;}
  .grow{flex:1;min-width:0;}
  .btn{border:none;border-radius:10px;padding:8px 13px;font-weight:700;font-size:13px;cursor:pointer;
    background:var(--accent);color:#fff;box-shadow:0 2px 6px rgba(229,138,60,.35);transition:transform .08s;}
  .btn:active{transform:scale(.94);}
  .btn:disabled{background:#d8c8b2;box-shadow:none;cursor:not-allowed;color:#fff;}
  .btn.green{background:var(--green);box-shadow:0 2px 6px rgba(111,168,79,.35);}
  .btn.blue{background:var(--blue);box-shadow:0 2px 6px rgba(79,134,198,.35);}
  .btn.ghost{background:#f3e8d6;color:var(--ink);box-shadow:none;}
  .btn.sm{padding:5px 10px;font-size:12px;border-radius:8px;}
  .pill{display:inline-flex;align-items:center;gap:3px;background:#f3e8d6;border-radius:20px;padding:2px 9px;font-size:11.5px;font-weight:700;color:#7a6448;}

  /* farm grid — 3x3 等大正方形 */
  .plot-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .plot{aspect-ratio:3/2;background:linear-gradient(160deg,#f6ead2,#efdcbc);border:1px solid #e3cfa8;border-radius:13px;
    padding:5px;position:relative;cursor:pointer;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
  .plot.ready{animation:bob .9s ease-in-out infinite;border-color:var(--green);}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  .plot .crop{font-size:30px;line-height:1.05;filter:drop-shadow(0 2px 2px rgba(0,0,0,.12));}
  .plot .cropname{font-size:11px;font-weight:700;margin-top:1px;}
  .plot .pbar{height:6px;width:80%;background:#e0cba6;border-radius:5px;overflow:hidden;margin-top:5px;}
  .plot .pfill{height:100%;background:linear-gradient(90deg,#8fc16a,#6fa84f);width:0%;}
  .plot .worker{position:absolute;top:3px;right:4px;font-size:16px;}
  .plot .lvtag{position:absolute;top:3px;left:5px;font-size:10px;font-weight:800;color:#a8835a;}
  .plot.newplot{color:var(--muted);background:repeating-linear-gradient(45deg,#f1e6d3,#f1e6d3 8px,#ece0cb 8px,#ece0cb 16px);border-style:dashed;}
  .plot.lockcell{background:#efe4d2;border-style:dashed;border-color:#ddc8a8;cursor:default;opacity:.6;}
  .plot.ready .ripe{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:800;color:var(--green-d);}

  /* ingredient chips */
  .ing-wrap{display:flex;flex-wrap:wrap;gap:6px;}
  .ing{display:flex;align-items:center;gap:3px;background:#f6ecda;border:1px solid #ecdcc0;border-radius:9px;padding:4px 8px;font-size:13px;font-weight:700;}
  .ing .n{color:#7a6448;font-size:12px;}

  /* 背包格子 */
  .bag{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;}
  .bag-cell{position:relative;aspect-ratio:1/1;background:linear-gradient(160deg,#f6ecda,#efdfc4);border:1px solid #e3cfa8;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:25px;box-shadow:inset 0 1px 2px rgba(255,255,255,.6),0 1px 2px rgba(150,110,50,.1);}
  .bag-cell{cursor:pointer;}
  .bag-cell .qty{position:absolute;right:3px;bottom:2px;font-size:10px;font-weight:800;color:#5b4632;background:rgba(255,255,255,.82);border-radius:6px;padding:0 3px;min-width:14px;text-align:center;line-height:14px;}
  .bag-cell .price{position:absolute;left:3px;top:2px;font-size:8px;font-weight:800;color:#b9742f;}
  .bag-cell.empty{opacity:.35;}
  .bag-cell:active{transform:scale(.94);}

  /* 生长能量分行 + 排序按钮 */
  .grow-line{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:#7a6448;padding:4px 0;border-top:1px dashed var(--line);}
  .sortbtns{display:flex;gap:4px;}
  .sortb{border:1px solid var(--line);background:#f3e8d6;color:#7a6448;border-radius:7px;padding:2px 8px;font-size:11px;font-weight:700;cursor:pointer;}
  .sortb.on{background:var(--accent);color:#fff;border-color:var(--accent);}

  /* monster cards */
  .mon-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;}
  .mon{border-radius:14px;padding:8px 6px 9px;text-align:center;position:relative;cursor:pointer;border:2px solid;background:var(--panel);}
  .mon.r-普通{border-color:#cdbfa8;} .mon.r-稀有{border-color:#5fa9d8;box-shadow:0 0 0 2px rgba(95,169,216,.12);}
  .mon.r-史诗{border-color:#b07fd8;box-shadow:0 0 0 2px rgba(176,127,216,.14);} .mon.r-传说{border-color:#e8b23a;box-shadow:0 0 10px rgba(232,178,58,.4);}
  .mon .sprite{font-size:36px;line-height:1.05;}
  .mon .mn{font-size:12px;font-weight:800;margin-top:1px;}
  .mon .job{font-size:10px;font-weight:700;color:#fff;border-radius:20px;padding:1px 7px;display:inline-block;margin-top:3px;}
  .job-farm{background:var(--green);} .job-cook{background:var(--accent);} .job-serve{background:var(--blue);} .job-battle{background:var(--red);} .job-idle{background:#bbb;}
  .mon .lv{position:absolute;top:4px;left:6px;font-size:10px;font-weight:800;color:#a8835a;}
  .mon .star{position:absolute;top:3px;right:5px;font-size:10px;}
  .mon.sel{outline:3px solid var(--accent);outline-offset:1px;}

  .stat-line{display:flex;justify-content:center;gap:7px;font-size:10px;color:var(--muted);margin-top:3px;font-weight:700;}

  /* tower defense */
  #tdCanvas{width:100%;height:auto;background:linear-gradient(#bfe3a4,#a9d488);border-radius:12px;display:block;touch-action:none;}
  .tower-tray{display:flex;gap:8px;overflow-x:auto;padding:4px 0;}
  .tslot{flex:0 0 auto;border:1px solid var(--line);border-radius:10px;padding:6px 9px;text-align:center;background:var(--panel);cursor:pointer;min-width:64px;}
  .tslot.sel{outline:2px solid var(--accent);}
  .tslot.lock{opacity:.45;filter:grayscale(.6);}
  .tslot .ts{font-size:24px;}
  .tslot .tn{font-size:10px;font-weight:800;}

  /* tasks */
  .task{border-left:5px solid var(--accent);}
  .task.proj-NP{border-left-color:#e07a5f;} .task.proj-ZF{border-left-color:#4f86c6;}
  .task.proj-LH{border-left-color:#e8a0c0;} .task.proj-Seminar{border-left-color:#9a6fc6;} .task.proj-生活{border-left-color:#6fa84f;}
  .reward{display:flex;gap:8px;flex-wrap:wrap;margin-top:7px;}
  .reward .rw{font-size:11.5px;font-weight:800;background:#fef0dc;border-radius:8px;padding:3px 8px;color:#b9742f;}

  /* achievements */
  .ach{display:flex;gap:11px;align-items:center;}
  .ach .abadge{font-size:30px;width:46px;text-align:center;}
  .ach .cap-btn{display:flex;align-items:center;gap:1px;border:1px solid #f1c860;background:#fff3e0;border-radius:9px;padding:3px 6px 3px 4px;font-size:11px;font-weight:800;color:#c9533f;cursor:pointer;flex:0 0 auto;animation:epulse 2.2s ease-in-out infinite;}
  .ach .cap-btn:active{transform:scale(.92);}
  .ach .cap-got{flex:0 0 auto;opacity:.4;filter:grayscale(.6);}
  .ach.locked{opacity:.5;filter:grayscale(.9);}
  .ach .at{font-weight:800;font-size:13.5px;}
  .ach .ad{font-size:11.5px;color:var(--muted);}

  /* toast + modal */
  #toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;}
  .toast{background:#4a3b2a;color:#fff;padding:8px 15px;border-radius:20px;font-size:13px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.25);animation:pop .3s;}
  @keyframes pop{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}
  .overlay{position:fixed;inset:0;background:rgba(60,40,20,.45);z-index:90;display:flex;align-items:center;justify-content:center;padding:18px;}
  .modal{background:var(--panel);border-radius:18px;max-width:380px;width:100%;padding:18px;box-shadow:0 12px 40px rgba(0,0,0,.3);max-height:86vh;overflow:auto;}
  .modal h3{font-size:16px;margin-bottom:10px;}
  .x{float:right;border:none;background:#f3e8d6;border-radius:8px;width:28px;height:28px;font-size:16px;cursor:pointer;color:#7a6448;}

  /* cooking pot */
  .pot{background:#f6ead2;border:2px dashed #d8b98a;border-radius:14px;min-height:60px;padding:10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;}
  .pot .ph{color:var(--muted);font-size:12px;}
  .recipe-known{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:12.5px;}
  .banner{background:linear-gradient(100deg,#fff2dd,#ffe7c6);border:1px solid #f0d6a8;border-radius:12px;padding:9px 12px;font-size:12.5px;color:#9a6a2a;font-weight:600;margin-bottom:12px;}
  .offline{background:#eef6e6;border-color:#cfe6b8;color:#4d7a2e;}
</style>
</head>
<body>

<div class="topbar" id="topbar"></div>

<div id="app"></div>

<div class="tabbar" id="tabbar">
  <button class="tab active" data-tab="farm"><span class="tico">🌱</span>农场</button>
  <button class="tab" data-tab="kitchen"><span class="tico">🍳</span>厨房</button>
  <button class="tab" data-tab="monsters"><span class="tico">👾</span>伙伴</button>
  <button class="tab" data-tab="restaurant"><span class="tico">🏰</span>餐厅</button>
</div>

<div id="toast"></div>
<div id="modalRoot"></div>

<script>
/* =========================================================================
   任务农场 — Kanban Farm idle 原型
   单文件 / 纯前端 / 模拟数据。核心循环：种田屯材料 → 做菜解锁塔 →
   收服怪兽派工&编队 → 餐厅塔防经营。看板任务完成给高级奖励。
   ========================================================================= */

const GAME_VERSION = 'v1.4 · 2026-06-01（测试模式·抬头两行·S24宽度360）';

// ---------- 内容定义 ----------
const ING = {
  wheat:{e:'🌾',n:'小麦',cat:'谷物',price:2}, tomato:{e:'🍅',n:'番茄',cat:'蔬菜',price:3}, chili:{e:'🌶️',n:'辣椒',cat:'蔬菜',price:4},
  egg:{e:'🥚',n:'蛋',cat:'其他',price:3}, cheese:{e:'🧀',n:'奶酪',cat:'其他',price:5}, fish:{e:'🐟',n:'鱼',cat:'肉类',price:6},
  meat:{e:'🥩',n:'肉',cat:'肉类',price:7}, herb:{e:'🌿',n:'香料',cat:'香料',price:5}
};
const ING_KEYS = Object.keys(ING);

// 菜谱（手动配齐材料即可解锁对应塔）
const RECIPES = [
  {id:'pizza', e:'🍕', n:'披萨',   need:{wheat:3,tomato:2,cheese:2}, tower:{dmg:7, range:95, rate:55, e:'🍕', n:'披萨塔'}},
  {id:'mxw',   e:'🍲', n:'毛血旺', need:{chili:3,fish:2,meat:2},     tower:{dmg:16,range:70, rate:90, e:'🍲', n:'毛血旺塔'}},
  {id:'ramen', e:'🍜', n:'拉面',   need:{wheat:2,egg:2,meat:1},      tower:{dmg:5, range:130,rate:40, e:'🍜', n:'拉面塔'}},
  {id:'sushi', e:'🍣', n:'寿司',   need:{fish:3,herb:1},             tower:{dmg:10,range:80, rate:65, e:'🍣', n:'寿司塔'}},
  {id:'omu',   e:'🍳', n:'蛋包饭', need:{egg:3,herb:1,cheese:1},     tower:{dmg:6, range:100,rate:50, e:'🍳', n:'蛋包饭塔'}},
];

// 怪兽图鉴模板
const MON_POOL = [
  {key:'hamster', s:'🐹', n:'仓鼠农夫', rar:'普通', best:'farm',  base:{farm:6,cook:2,serve:3,battle:2}},
  {key:'mush',    s:'🍄', n:'蘑菇精',   rar:'普通', best:'farm',  base:{farm:5,cook:3,serve:2,battle:3}},
  {key:'fox',     s:'🦊', n:'狐狸大厨', rar:'稀有', best:'cook',  base:{farm:2,cook:7,serve:4,battle:3}},
  {key:'owl',     s:'🦉', n:'博士猫头鹰',rar:'稀有', best:'cook',  base:{farm:3,cook:6,serve:3,battle:2}},
  {key:'penguin', s:'🐧', n:'企鹅侍者', rar:'普通', best:'serve', base:{farm:2,cook:3,serve:7,battle:2}},
  {key:'octo',    s:'🐙', n:'八爪服务生',rar:'稀有', best:'serve', base:{farm:3,cook:5,serve:6,battle:3}},
  {key:'dragon',  s:'🐲', n:'小火龙',   rar:'史诗', best:'battle',base:{farm:2,cook:3,serve:2,battle:9}},
  {key:'oni',     s:'👹', n:'赤鬼武者', rar:'史诗', best:'battle',base:{farm:3,cook:2,serve:2,battle:10}},
  {key:'unicorn', s:'🦄', n:'独角兽',   rar:'传说', best:'farm',  base:{farm:9,cook:6,serve:6,battle:8}},
];

// 看板任务（模拟，镜像你的真实项目）
const TASKS = [
  {id:1, proj:'NP', t:'准备 outline、figures 和 extended figures', rw:{energy:3, xp:60, mon:'fox'}},
  {id:2, proj:'ZF', t:'继续 ZF study — 分析 IR + 5000 shot 数据', rw:{energy:2, xp:45, ing:{fish:5,herb:3}}},
  {id:3, proj:'LH', t:'检查 reduced model 物理模型', rw:{energy:2, xp:40, coin:120}},
  {id:4, proj:'Seminar', t:'Postdoc seminar talk: zonal flows', rw:{energy:2, xp:50, mon:'owl'}},
  {id:5, proj:'生活', t:'订 & 取 donuts', rw:{energy:1, xp:20, ing:{wheat:6,egg:4}}},
  {id:6, proj:'NP', t:'🎯 递交 Nature Physics', rw:{energy:8, xp:200, mon:'unicorn', legend:true}},
];

const RAR_STAR = {'普通':'⭐','稀有':'⭐⭐','史诗':'⭐⭐⭐','传说':'👑'};

// 已就绪的 AI 精灵图（有则用图，无则回退 emoji）
const MON_IMG = {
  hamster:'farm-assets/mon_hamster.png',
  fox:'farm-assets/mon_fox.png',
  dragon:'farm-assets/mon_dragon.png',
};
function monSprite(m, px){
  px = px||36;
  if(m && MON_IMG[m.key]) return `<img src="${MON_IMG[m.key]}" alt="" draggable="false" style="width:${px}px;height:${px}px;object-fit:contain;vertical-align:middle;filter:drop-shadow(0 2px 2px rgba(0,0,0,.15))">`;

function fmt(n){ n=Math.floor(n); if(n>=1e9)return Math.floor(n/1e9)+'B'; if(n>=1e6)return Math.floor(n/1e6)+'M'; if(n>=1e3)return Math.floor(n/1e3)+'k'; return ''+n; }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg){
  const t=document.getElementById('toast');
  const d=document.createElement('div'); d.className='toast'; d.textContent=msg;
  t.appendChild(d); setTimeout(()=>d.remove(),2200);
}
function levelNeed(lv){ return 50 + lv*lv*30; }
function addXp(x){
  S.xp += x;
  while(S.xp >= levelNeed(S.level)){ S.xp -= levelNeed(S.level); S.level++; toast(`🎉 升到 Lv.${S.level}！`); }
}
function monById(id){ return S.monsters.find(m=>m.id===id); }
function plotSpeed(p){
  let base = 1 + p.lv*0.5;
  if(p.worker){ const m=monById(p.worker); if(m) base += m.stats.farm*0.35; }
  return base;
}
function plotMax(p){ return 8 + p.lv*4; }
// 生长能量：基础 1 + 已完成任务×0.1 + 已关闭(被X掉)提醒×0.01，驱动整片农场产出
function growthStats(){
  const d=KANBAN.data; let done=0, dis=0;
  if(d){ done=d.tasks.filter(t=>t.status==='done').length; dis=(d.reminders||[]).filter(r=>r.dismissedUntil).length; }
  else { done=(S.doneTasks||[]).length; }
  return {done, dis, mult: 1 + 0.1*done + 0.01*dis};
}

// ---------- idle tick ----------
function tick(dtSec){
  // 农场生长
  S.plots.forEach(p=>{
    if(!p.unlocked || !p.crop) return;
    p.prog += plotSpeed(p)*dtSec*growthStats().mult;
    // 自动收获：满了就入库并重新开始（idle 核心）
    while(p.prog >= 100){
      p.prog -= 100;
      S.ing[p.crop] = (S.ing[p.crop]||0) + 1;
    }
  });
  // 餐厅被动金币（已解锁塔越多越赚）
  if(S.unlockedTowers.length){
    S.coin += S.unlockedTowers.length * 0.6 * dtSec * (S.satisfaction/100);
  }
  checkAch();
}

function addPot(k){
  if((S.ing[k]||0) - selectedPotIngs.filter(x=>x===k).length <= 0){ toast('这个材料不够了'); return; }

  const match = RECIPES.find(r=>{

function selTower(id){
  document.querySelectorAll('.tslot').forEach(e=>e.classList.remove('sel'));
  const el=document.querySelector(`.tslot[data-tower="${id}"]`); if(el) el.classList.add('sel');
  td.selTower=id; toast('已选塔，点画布上的绿色空位放置');
}
function initTD(){
  const cv=document.getElementById('tdCanvas'); if(!cv) return;
  const ctx=cv.getContext('2d');
  // 路径点（顾客从左排队进店）
  const path=[{x:0,y:90},{x:180,y:90},{x:180,y:200},{x:430,y:200},{x:430,y:90},{x:600,y:90}];
  // 放塔点
  const slots=[{x:90,y:150},{x:180,y:140},{x:300,y:140},{x:300,y:250-110},{x:430,y:150},{x:520,y:200}];
  td={ctx,cv,path,slots,selTower:null,towers:[],enemies:[],shots:[],wave:0,running:false,raf:null};
  cv.onclick=(e)=>{
    const rect=cv.getBoundingClientRect(); const sx=cv.width/rect.width, sy=cv.height/rect.height;
    const mx=(e.clientX-rect.left)*sx, my=(e.clientY-rect.top)*sy;
    // 找最近空 slot
    let hit=-1,best=1e9;
    td.slots.forEach((s,i)=>{ const d=Math.hypot(s.x-mx,s.y-my); if(d<32 && d<best && !td.towers.find(t=>t.slot===i)){best=d;hit=i;} });
    if(hit>=0){
      if(!td.selTower){ toast('先在下方选一个菜品塔'); return; }
      const r=RECIPES.find(x=>x.id===td.selTower);
      td.towers.push({slot:hit,x:td.slots[hit].x,y:td.slots[hit].y,...r.tower,cd:0,id:r.id});
      toast(`放置了 ${r.tower.n}`);
    }
  };
  drawTD();
}
function startWave(){
  if(!td){ return; }
  if(!td.towers.length){ toast('先放至少一个菜品塔再营业'); }
  td.wave++;
  const n=4+td.wave*2;
  for(let i=0;i<n;i++){
    const t=WILD[Math.floor(Math.random()*3)];
    td.enemies.push({s:t.s,hp:18+td.wave*6,max:18+td.wave*6,seg:0,t:-i*0.6,spd:34+td.wave*2});
  }
  if(!td.running){ td.running=true; td.last=performance.now(); loopTD(); }
  toast(`第 ${td.wave} 波顾客上门！`);
}
function loopTD(){
  const now=performance.now(); const dt=Math.min(0.05,(now-(td.last||now))/1000); td.last=now;
  stepTD(dt); drawTD();
  if(td.enemies.length || td.shots.length){ td.raf=requestAnimationFrame(loopTD); }
  else { td.running=false; }
}
function pathPos(seg,frac){
  const a=td.path[seg], b=td.path[seg+1];
  return {x:a.x+(b.x-a.x)*frac, y:a.y+(b.y-a.y)*frac};
}
function stepTD(dt){
  // 敌人沿路径
  td.enemies.forEach(en=>{
    if(en.t<0){ en.t+=dt; return; }
    let move=en.spd*dt;
    while(move>0 && en.seg<td.path.length-1){
      const a=td.path[en.seg], b=td.path[en.seg+1];
      const segLen=Math.hypot(b.x-a.x,b.y-a.y);
      en.dist=(en.dist||0)+move;
      if(en.dist>=segLen){ move=en.dist-segLen; en.dist=0; en.seg++; }
      else move=0;
    }
    const a=td.path[Math.min(en.seg,td.path.length-2)];
    const b=td.path[Math.min(en.seg+1,td.path.length-1)];
    const segLen=Math.hypot(b.x-a.x,b.y-a.y)||1; const f=Math.min(1,(en.dist||0)/segLen);
    en.x=a.x+(b.x-a.x)*f; en.y=a.y+(b.y-a.y)*f;
    if(en.seg>=td.path.length-1){ en.gone=true; }
  });
  // 到店未被招待 → 满意度下降
  td.enemies.filter(e=>e.gone).forEach(()=>{ S.satisfaction=Math.max(0,S.satisfaction-2); });
  td.enemies=td.enemies.filter(e=>!e.gone && e.hp>0);
  // 塔开火
  td.towers.forEach(t=>{
    t.cd-=dt*1000;
    if(t.cd<=0){
      const tgt=td.enemies.filter(e=>e.t>=0 && Math.hypot(e.x-t.x,e.y-t.y)<t.range).sort((a,b)=>b.seg-a.seg)[0];
      if(tgt){ td.shots.push({x:t.x,y:t.y,tx:tgt,dmg:t.dmg,e:t.e}); t.cd=t.rate; }
    }
  });
  // 子弹
  td.shots.forEach(sh=>{
    if(!sh.tx || sh.tx.hp<=0){ sh.dead=true; return; }
    const dx=sh.tx.x-sh.x, dy=sh.tx.y-sh.y, d=Math.hypot(dx,dy);
    if(d<10){ sh.tx.hp-=sh.dmg; sh.dead=true;
      if(sh.tx.hp<=0){ S.coin+=8; S.satisfaction=Math.min(100,S.satisfaction+1); addXp(2); }
    } else { sh.x+=dx/d*420*dt; sh.y+=dy/d*420*dt; }
  });
  td.shots=td.shots.filter(s=>!s.dead);
  const st=document.getElementById('satTxt'); if(st) st.textContent=Math.round(S.satisfaction)+'%';
}
function drawTD(){
  const {ctx,cv}=td; ctx.clearRect(0,0,cv.width,cv.height);
  // 草地纹理
  ctx.fillStyle='#a9d488'; ctx.fillRect(0,0,cv.width,cv.height);
  // 路径
  ctx.strokeStyle='#d9c08a'; ctx.lineWidth=26; ctx.lineJoin='round'; ctx.lineCap='round';
  ctx.beginPath(); td.path.forEach((p,i)=> i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)); ctx.stroke();
  ctx.strokeStyle='#c8ab6e'; ctx.lineWidth=2; ctx.setLineDash([6,8]);
  ctx.beginPath(); td.path.forEach((p,i)=> i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)); ctx.stroke(); ctx.setLineDash([]);
  // 店门
  ctx.font='26px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('🏪', 588, 90);
  // slot 空位
  td.slots.forEach((s,i)=>{ if(!td.towers.find(t=>t.slot===i)){ ctx.fillStyle='rgba(255,255,255,.35)';
    ctx.beginPath(); ctx.arc(s.x,s.y,16,0,7); ctx.fill(); ctx.fillStyle='#5c8a3a'; ctx.font='13px sans'; ctx.fillText('+',s.x,s.y); } });
  // 塔
  td.towers.forEach(t=>{ ctx.font='30px serif'; ctx.fillText(t.e,t.x,t.y);
    ctx.strokeStyle='rgba(255,255,255,.18)'; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(t.x,t.y,t.range,0,7); ctx.stroke(); });
  // 敌人
  td.enemies.forEach(en=>{ if(en.t<0||en.x==null)return; ctx.font='24px serif'; ctx.fillText(en.s,en.x,en.y);
    ctx.fillStyle='#c0392b'; ctx.fillRect(en.x-12,en.y-18,24,4);
    ctx.fillStyle='#27ae60'; ctx.fillRect(en.x-12,en.y-18,24*Math.max(0,en.hp/en.max),4); });
  // 子弹
  td.shots.forEach(sh=>{ ctx.font='15px serif'; ctx.fillText(sh.e,sh.x,sh.y); });
}

// ============================ 任务（看板只读联动） ============================
function projClassKey(p){ return ({'NP 投稿':'NP','ZF Study':'ZF','LH Model':'LH','Seminar':'Seminar','生活':'生活'})[p]||'NP'; }
const PROJ_REWARD = {
  'NP 投稿':  {energy:3, xp:60, coin:80, mon:['fox','owl']},
  'ZF Study': {energy:2, xp:45, ing:{fish:5,herb:3}},
  'LH Model': {energy:2, xp:40, coin:120},
  'Seminar':  {energy:2, xp:50, mon:['owl']},
  '生活':      {energy:1, xp:20, ing:{wheat:6,egg:4}},
};
// —— 奖励发放 ——
function applyReward(rw){
  S.energy+=rw.energy||0; addXp(rw.xp||0); if(rw.coin)S.coin+=rw.coin;
  if(rw.ing)Object.entries(rw.ing).forEach(([k,v])=>S.ing[k]=(S.ing[k]||0)+v);
  let monGot=null;
  if(rw.legend) monGot=giveMonster('unicorn',true);
  else if(rw.mon&&rw.mon.length&&Math.random()<0.55) monGot=giveMonster(rw.mon[Math.floor(Math.random()*rw.mon.length)],true);
  return monGot;
}
function realRewardOf(t){ const b=PROJ_REWARD[t.project]||{energy:1,xp:25,coin:40}; return {...b, legend:/Nature Physics/i.test(t.title||'')}; }
function mockRw(t){ return {energy:t.rw.energy,xp:t.rw.xp,coin:t.rw.coin,ing:t.rw.ing,mon:t.rw.mon?[t.rw.mon]:null,legend:t.rw.legend}; }
function rewardChips(rw){
  const c=[];
  if(rw.energy)c.push(`扭蛋+${rw.energy}`); if(rw.xp)c.push(`✨+${rw.xp}`); if(rw.coin)c.push(`💰+${rw.coin}`);
  if(rw.ing)c.push(Object.entries(rw.ing).map(([k,v])=>`${ING[k].e}+${v}`).join(' '));
  if(rw.legend)c.push('🦄 传说怪兽'); else if(rw.mon&&rw.mon.length)c.push('👾 或得怪兽');
  return c.map(x=>`<span class="rw">${x}</span>`).join('');
}
function claimableReal(){ const d=KANBAN.data; return d? d.tasks.filter(t=>t.status==='done' && !S.rewarded.includes(t.id)) : []; }
function pendingCount(){
  return KANBAN.data ? claimableReal().length
    : TASKS.filter(t=>S.doneTasks.includes(t.id) && !S.rewarded.includes('m'+t.id)).length;
}
function rewardToast(mon,rw){ toast(`🎁 +${rw.energy||0} 扭蛋 +${rw.xp||0}xp${rw.coin?` +${rw.coin}💰`:''}${mon?' '+mon.s+mon.n:''}`); }
function openTasks(){
  const d=KANBAN.data; let claimHtml='', inHtml='';
  const row=(proj,title,chips,btn,extra)=>`<div class="card task proj-${proj}">
      <div class="row"><span class="pill">${escapeHtml(proj2label(proj))}</span><div class="grow" style="font-weight:700;font-size:13px">${escapeHtml(title)}</div>${extra||''}</div>
      <div class="reward">${chips}</div>${btn||''}</div>`;
  if(d){
    const cl=claimableReal(), ip=d.tasks.filter(t=>t.status==='inprogress');
    claimHtml=cl.map(t=>row(projClassKey(t.project),t.title,rewardChips(realRewardOf(t)),`<button class="btn green" style="width:100%;margin-top:8px" onclick="claimReal(${t.id})">🎁 领取奖励</button>`)).join('')
      || `<div class="screen-sub" style="padding:4px 2px">暂无待领取奖励。</div>`;
    inHtml=ip.map(t=>row(projClassKey(t.project),t.title,rewardChips(realRewardOf(t)),'',t.deadline?`<span class="rw" style="background:#eaf0fb;color:#4f86c6">📅${t.deadline}</span>`:'')).join('')
      || `<div class="screen-sub" style="padding:4px 2px">看板里暂无进行中的任务。</div>`;
  } else {
    const cl=TASKS.filter(t=>S.doneTasks.includes(t.id)&&!S.rewarded.includes('m'+t.id));
    const ip=TASKS.filter(t=>!S.doneTasks.includes(t.id));
    claimHtml=cl.map(t=>row(t.proj,t.t,rewardChips(mockRw(t)),`<button class="btn green" style="width:100%;margin-top:8px" onclick="claimMock(${t.id})">🎁 领取奖励</button>`)).join('')
      || `<div class="screen-sub" style="padding:4px 2px">暂无待领取奖励。</div>`;
    inHtml=ip.map(t=>row(t.proj,t.t,rewardChips(mockRw(t)),`<button class="btn ghost" style="width:100%;margin-top:8px" onclick="markMockDone(${t.id})">✅ 完成（测试）</button>`)).join('');
  }
  modal(`<h3>📋 任务 <button class="x" onclick="closeModal()">×</button></h3>
    <div style="font-weight:800;font-size:13px;margin:2px 0 6px">🎁 待领取奖励</div>${claimHtml}
    <div style="font-weight:800;font-size:13px;margin:14px 0 6px">🔵 进行中</div>${inHtml}`);
}
function proj2label(p){ return ({'NP':'NP 投稿','ZF':'ZF Study','LH':'LH Model','Seminar':'Seminar','生活':'生活'})[p]||p; }
function claimReal(id){
  const t=KANBAN.data&&KANBAN.data.tasks.find(x=>x.id===id); if(!t||S.rewarded.includes(id)) return;
  const rw=realRewardOf(t); const mon=applyReward(rw); S.rewarded.push(id);
  rewardToast(mon,rw); checkAch(); saveGame(); openTasks();
}
function claimMock(id){
  if(S.rewarded.includes('m'+id)) return;
  const t=TASKS.find(x=>x.id===id); const rw=mockRw(t); const mon=applyReward(rw); S.rewarded.push('m'+id);
  rewardToast(mon,rw); checkAch(); saveGame(); openTasks();
}
function markMockDone(id){ if(!S.doneTasks.includes(id)) S.doneTasks.push(id); saveGame(); openTasks(); }

// ============================ 成就 ============================
const ACHS = [
  {id:'firstHarvest', e:'🌾', t:'初次收获', d:'收获第一份材料', chk:s=>ING_KEYS.some(k=>s.ing[k]>4)},
  {id:'cook1', e:'🍳', t:'下厨房', d:'第一次烹饪', chk:s=>s.cookedCount>=1},
  {id:'tower1', e:'🏰', t:'开张大吉', d:'解锁第一个菜品塔', chk:s=>s.unlockedTowers.length>=1},
  {id:'mon3', e:'👾', t:'怪兽训练家', d:'收集 3 只怪兽', chk:s=>s.monsters.length>=3},
  {id:'plot4', e:'🚜', t:'扩张农场', d:'开垦第 4 块地', chk:s=>s.plots.filter(p=>p.unlocked).length>=4},
  {id:'task3', e:'📋', t:'高效科研', d:'领取 3 次任务奖励', chk:s=>((s.rewarded||[]).length)>=3},
  {id:'legend', e:'👑', t:'登上 Nature', d:'递交 Nature Physics（得独角兽）', chk:s=>s.monsters.some(m=>m.key==='unicorn')},
  {id:'rich', e:'💰', t:'小有积蓄', d:'金币达到 500', chk:s=>s.coin>=500},
];
function checkAch(){
  ACHS.forEach(a=>{ if(!S.ach[a.id] && a.chk(S)){ S.ach[a.id]=true; toast(`🏆 成就解锁：${a.t}`); } });
}
function openAchievements(){
  if(!S.achClaimed) S.achClaimed=[];
  const got=Object.keys(S.ach).length;
  const items=ACHS.map(a=>{ const on=S.ach[a.id]; const claimed=S.achClaimed.includes(a.id);
    let right='';
    if(on) right = claimed
      ? `<span class="cap-got" title="已领取扭蛋">${gachaSVG(20)}</span>`
      : `<button class="cap-btn" onclick="claimAch('${a.id}')" title="领取扭蛋">${gachaSVG(18)}+1</button>`;
    return `<div class="card ach ${on?'':'locked'}"><div class="abadge">${a.e}</div>
      <div class="grow"><div class="at">${a.t} ${on?'✅':'🔒'}</div><div class="ad">${a.d}</div></div>${right}</div>`;
  }).join('');
  modal(`<h3>🏆 成就（${got}/${ACHS.length}）<button class="x" onclick="closeModal()">×</button></h3>
    <div class="screen-sub" style="margin-bottom:8px">每解锁一个成就可领取 1 颗扭蛋（点右侧图标领取）。</div>${items}`);
}
function claimAch(id){
  if(!S.achClaimed) S.achClaimed=[];
  if(!S.ach[id] || S.achClaimed.includes(id)) return;
  S.achClaimed.push(id); S.energy+=1;
  toast('领取扭蛋 +1'); saveGame(); openAchievements();
}

// ============================ 导航 / 启动 ============================
function switchTab(name){
  curTab=name;
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active', b.dataset.tab===name));
  (({farm:renderFarm, kitchen:renderKitchen, monsters:renderMonsters, restaurant:renderRestaurant}[name])||renderFarm)();
}
document.getElementById('tabbar').addEventListener('click', e=>{
  const b=e.target.closest('.tab'); if(b) switchTab(b.dataset.tab);
});

// modal helpers
function modal(html){ document.getElementById('modalRoot').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`; }
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }

// ============================ 看板只读接入 ============================
const KANBAN = { data:null, lastSync:0, GIST_FALLBACK:'337496bdc9d3c0c145fb756648dbf283' };
function kanbanToken(){ try{ return JSON.parse(localStorage.getItem('kanban-sync-settings-v1')||'null'); }catch(e){ return null; } }
async function fetchKanban(){
  if(S.testMode) return null;             // 测试模式：断开看板，改用可手动完成的模拟任务
  const s=kanbanToken();
  const gistId=(s&&s.gistId)||KANBAN.GIST_FALLBACK;
  const token=s&&s.token;
  if(!token) return null;                         // 同源未登录看板→无 token，仅离线演示
  const res=await fetch('https://api.github.com/gists/'+gistId,{headers:{Authorization:'token '+token,Accept:'application/vnd.github+json'}});
  if(!res.ok) throw new Error('HTTP '+res.status);
  const g=await res.json();
  return JSON.parse(g.files['kanban-data.json'].content);   // 只 GET，从不 PATCH（只读）
}
function upcomingReminders(rems){
  const today=new Date(); today.setHours(0,0,0,0); const out=[];
  (rems||[]).forEach(r=>{
    if(r.recurrence==='once' && r.date){
      const d=new Date(r.date+'T00:00:00'); const days=Math.round((d-today)/864e5);
      if(days>=0 && days<=10) out.push({title:r.title,days,cat:r.category,time:r.time});
    }
  });
  out.sort((a,b)=>a.days-b.days); return out;
}
async function syncKanban(initial){
  let d=null;
  try{ d=await fetchKanban(); }catch(e){ if(initial) toast('看板未连接：'+e.message); }
  if(!d){ return; }
  KANBAN.data=d; KANBAN.lastSync=Date.now();
  PROJ_COUNTS={};
  d.tasks.forEach(t=>{ if(t.status==='inprogress') PROJ_COUNTS[t.project]=(PROJ_COUNTS[t.project]||0)+1; });
  EVENTS = upcomingReminders(d.reminders);
  if(!S.syncedOnce){
    // 首次连接：把当前已完成的任务设为基线（不把历史任务变成待领取）
    d.tasks.forEach(t=>{ if(t.status==='done' && !S.rewarded.includes(t.id)) S.rewarded.push(t.id); });
    S.syncedOnce=true;
  }
  // 不再自动发奖：已完成且未领取的任务会出现在 📋 任务面板，由你手动「领取奖励」
  saveGame(); renderTopbar();
  if(curTab==='farm') renderFarm();
  if(curTab==='restaurant') renderRestaurant();
}

// ============================ 存档（本地 + 云端；云端用独立 gist，绝不碰看板） ============================
const SAVE_KEY='farm-game-save-v1';
const SAVE_GIST_KEY='farm-save-gist-id';
let localSavedAt=0, SAVE_GIST_ID=null, lastCloudSave=0, cloudTimer=null;

function saveGame(){
  try{ S.lastTick=Date.now(); localSavedAt=Date.now();
    localStorage.setItem(SAVE_KEY, JSON.stringify({S,monSeq,savedAt:localSavedAt})); }catch(e){}
  cloudSave(false);
}
function loadGame(){
  let raw; try{ raw=localStorage.getItem(SAVE_KEY); }catch(e){}
  if(!raw) return false;
  try{ const o=JSON.parse(raw); if(!o.S||!Array.isArray(o.S.plots)) return false;
    S=o.S; monSeq=o.monSeq||1; localSavedAt=o.savedAt||0;
    if(!S.rewarded) S.rewarded=[]; if(typeof S.syncedOnce!=='boolean') S.syncedOnce=false;
    return true;
  }catch(e){ return false; }
}
// —— 云端存档：独立私有 gist（文件 farm-save.json），与看板 gist 完全分开，只写这一个 ——
async function ensureSaveGist(token){
  try{ const cached=localStorage.getItem(SAVE_GIST_KEY); if(cached) return cached; }catch(e){}
  try{ // 在你已有 gist 里按文件名找存档（实现跨设备同步）
    const r=await fetch('https://api.github.com/gists?per_page=100',{headers:{Authorization:'token '+token,Accept:'application/vnd.github+json'}});
    if(r.ok){ const list=await r.json(); const hit=list.find(g=>g.files&&g.files['farm-save.json']);
      if(hit){ try{localStorage.setItem(SAVE_GIST_KEY,hit.id);}catch(e){} return hit.id; } }
  }catch(e){}
  try{ // 没有就新建一个私有 gist（绝不动看板 gist）
    const cr=await fetch('https://api.github.com/gists',{method:'POST',headers:{Authorization:'token '+token,'Content-Type':'application/json',Accept:'application/vnd.github+json'},
      body:JSON.stringify({description:'任务农场存档（自动创建，可删；与看板无关）',public:false,files:{'farm-save.json':{content:JSON.stringify({S,monSeq,savedAt:Date.now()})}}})});
    if(cr.ok){ const g=await cr.json(); try{localStorage.setItem(SAVE_GIST_KEY,g.id);}catch(e){} return g.id; }
  }catch(e){}
  return null;
}
async function loadCloud(token,id){
  try{
    const r=await fetch('https://api.github.com/gists/'+id,{headers:{Authorization:'token '+token,Accept:'application/vnd.github+json'}});
    if(!r.ok) return null; const g=await r.json(); const f=g.files&&g.files['farm-save.json'];
    if(!f||!f.content) return null; return JSON.parse(f.content);
  }catch(e){ return null; }
}
function cloudSave(force){
  const s=kanbanToken(); if(!(s&&s.token&&SAVE_GIST_ID)) return;
  const now=Date.now();
  if(!force && now-lastCloudSave<30000){ if(!cloudTimer) cloudTimer=setTimeout(()=>{cloudTimer=null;cloudSave(true);},30000); return; }
  if(cloudTimer){ clearTimeout(cloudTimer); cloudTimer=null; }
  lastCloudSave=now;
  fetch('https://api.github.com/gists/'+SAVE_GIST_ID,{method:'PATCH',headers:{Authorization:'token '+s.token,'Content-Type':'application/json',Accept:'application/vnd.github+json'},
    body:JSON.stringify({files:{'farm-save.json':{content:JSON.stringify({S,monSeq,savedAt:Date.now()})}}})}).catch(()=>{});
}
async function cloudInitAndMerge(){
  const s=kanbanToken(); if(!(s&&s.token)) return false;   // 无 token（如本地 file://）→ 仅本地存档
  SAVE_GIST_ID=await ensureSaveGist(s.token);
  if(!SAVE_GIST_ID) return false;
  const cloud=await loadCloud(s.token,SAVE_GIST_ID);
  if(cloud&&cloud.S&&Array.isArray(cloud.S.plots)&&(cloud.savedAt||0)>localSavedAt){
    S=cloud.S; monSeq=cloud.monSeq||monSeq; localSavedAt=cloud.savedAt;
    if(!S.rewarded)S.rewarded=[]; if(typeof S.syncedOnce!=='boolean')S.syncedOnce=false;
    return true;                       // 采用了更新的云端存档
  }
  if(!cloud||!cloud.S){ cloudSave(true); }  // 云端还没有 → 把本地推上去
  return false;
}
function applyOffline(){
  const now=Date.now(); let dt=(now-(S.lastTick||now))/1000;
  if(dt<60) return null; dt=Math.min(dt,8*3600);
  const before={}; ING_KEYS.forEach(k=>before[k]=S.ing[k]||0); const coin0=S.coin;
  tick(dt);
  const gained={}; ING_KEYS.forEach(k=>{ const g=(S.ing[k]||0)-before[k]; if(g>0) gained[k]=g; });
  return {gained, coin:Math.floor(S.coin-coin0), mins:Math.round(dt/60)};
}

// ============================ 启动 ============================
async function boot(){
  const had=loadGame();
  if(!had){ giveMonster('hamster',true); giveMonster('penguin',true); S.monsters[0].job='farm'; S.plots[0].worker=S.monsters[0].id; }
  renderTopbar(); renderFarm();                 // 先用本地存档秒开
  const adopted = await cloudInitAndMerge();     // 云端有更新的存档则覆盖
  const off = (had||adopted)?applyOffline():null;
  S.lastTick=Date.now();
  if(adopted){ renderTopbar(); if(curTab==='farm') renderFarm(); }
  setTimeout(()=>welcomeModal(off, !had && !adopted),300);
  syncKanban(true);
}
function welcomeModal(off,fresh){
  let body;
  if(fresh){
    body=`<div class="banner" style="margin:6px 0 12px">🎀 欢迎来到任务农场！</div>
      <div style="font-size:12.5px;color:var(--muted);line-height:1.6;margin-bottom:14px">
      🌱种田屯材料、🍳手动配菜谱解锁塔、👾收怪兽派工/编队打怪、🏰餐厅塔防招待怪兽顾客、📋在看板完成任务自动领奖、🏆解锁成就。<br><br>
      进度自动存档，离线也在挂机产出。</div>`;
  } else {
    const list=off&&Object.keys(off.gained).length?Object.entries(off.gained).map(([k,v])=>`${ING[k].e}${ING[k].n}×${v}`).join('、'):'一些材料';
    body=`<div class="banner offline" style="margin:6px 0 12px">😴 你离开的 ${off?off.mins:0} 分钟里，农场也在产出：<br><b>${list}</b>${off&&off.coin>0?`，还赚了 ${off.coin}💰`:''}，已入库。</div>`;
  }
  modal(`<h3>👋 任务农场</h3>${body}<button class="btn green" style="width:100%" onclick="closeModal()">开始玩 →</button>`);
}

// 自动存档 + 周期同步看板
setInterval(saveGame, 20000);
setInterval(()=>syncKanban(false), 60000);
document.addEventListener('visibilitychange',()=>{ if(document.hidden){ saveGame(); cloudSave(true); } else syncKanban(false); });
window.addEventListener('beforeunload', ()=>{ saveGame(); cloudSave(true); });

// Service Worker（离线缓存；file:// 下会静默失败，无妨）
if('serviceWorker' in navigator){ navigator.serviceWorker.register('farm-sw.js').catch(()=>{}); }

boot();
</script>
